name: Staging Safety

on:
  push:
    branches:
      - integration/pro-club-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_FUTVERSE_ENV: staging
      VITE_FIREBASE_PROJECT_ID: futverse-staging-ci
      VITE_FIREBASE_APP_ID: staging-ci-app-id
      VITE_FIREBASE_API_KEY: staging-ci-api-key
      VITE_FIREBASE_AUTH_DOMAIN: futverse-staging-ci.invalid
      VITE_FIREBASE_STORAGE_BUCKET: futverse-staging-ci.invalid
      VITE_FIREBASE_MESSAGING_SENDER_ID: "999999999999"
    steps:
      - name: Checkout staging lane
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install app dependencies deterministically
        run: npm ci

      - name: Install functions dependencies deterministically
        run: npm --prefix functions ci

      - name: Block production Firebase CLI target
        run: >-
          node -e "const fs=require('fs'); const cfg=JSON.parse(fs.readFileSync('.firebaserc','utf8')); const id=cfg?.projects?.default; if (!id || id === 'futverse-d7872' || !id.startsWith('futverse-staging-')) { console.error('STAGING_FIREBASE_CLI_TARGET_GATE=BLOCKED:' + String(id)); process.exit(1); } console.log('STAGING_FIREBASE_CLI_TARGET_GATE=PASS:' + id);"

      - name: Verify staging Firebase isolation contract
        run: node --import tsx --test tests/firebaseRuntimeConfig.unit.test.ts

      - name: Verify Vercel preview staging boundary
        run: node --import tsx --test tests/stagingVercelPrebuildGate.unit.test.ts

      - name: Verify Firebase staging bootstrap planner contract
        run: node --import tsx --test tests/firebaseStagingBootstrapPlanner.unit.test.ts

      - name: Verify live staging readiness and deploy guard contracts
        run: >-
          node --import tsx --test
          tests/liveStagingReadiness.unit.test.ts
          tests/liveStagingDeployGuard.unit.test.ts

      - name: Verify build-time staging isolation gate
        run: node scripts/verifyStagingIsolation.mjs

      - name: Verify PR60 candidate resolution contracts
        run: >-
          node --import tsx --test
          tests/functions.proClubStaffCandidateResolutionCallable.unit.test.ts
          tests/proClubStaffCandidateResolutionCore.unit.test.ts
          tests/proClubStaffCandidateResolutionRateLimiter.unit.test.ts
          tests/proClubStaffCandidateResolutionService.unit.test.ts
          tests/proClubStaffCandidateResolutionUi.unit.test.ts

      - name: Verify PR62 staff role contracts
        run: >-
          node --import tsx --test
          tests/proClubStaffManagementModel.unit.test.ts
          tests/proClubAuthorityContract.test.ts
          tests/proClubFoundation.test.ts
          tests/proClubInviteClaimMembershipRulesDataContractV1.test.ts
          tests/proClubOrganizationAdapterContract.test.ts
          tests/proClubStaffOnboardingV1Contract.test.ts

      - name: Verify staff roster read-model contract
        run: node --import tsx --test tests/proClubStaffRosterModel.unit.test.ts

      - name: Verify staff roster server service
        run: node --import tsx --test tests/functions.proClubStaffRosterService.unit.test.ts

      - name: Verify staff roster Firestore data source
        run: node --import tsx --test tests/functions.proClubStaffRosterFirestoreDataSource.unit.test.ts

      - name: Verify staff roster callable adapter
        run: node --import tsx --test tests/functions.proClubStaffRosterCallable.unit.test.ts

      - name: Verify staff roster function wiring
        run: node --import tsx --test tests/functions.proClubStaffRosterIndexContract.unit.test.ts

      - name: Verify staff roster client integration
        run: >-
          node --import tsx --test
          tests/proClubStaffRosterClient.unit.test.ts
          tests/proClubStaffRosterPortalContract.unit.test.ts

      - name: Verify staff management transition contract
        run: node --import tsx --test tests/proClubStaffManagementTransition.unit.test.ts

      - name: Verify staff management transition parity
        run: node --import tsx --test tests/proClubStaffManagementTransitionParity.unit.test.ts

      - name: Verify staff management server service
        run: node --import tsx --test tests/functions.proClubStaffManagementService.unit.test.ts

      - name: Verify staff management rate limiter
        run: node --import tsx --test tests/functions.proClubStaffManagementRateLimiter.unit.test.ts

      - name: Verify hardened staff management service
        run: node --import tsx --test tests/functions.proClubStaffManagementRateLimitedService.unit.test.ts

      - name: Verify staff management callable wiring
        run: >-
          node --import tsx --test
          tests/functions.proClubStaffManagementCallable.unit.test.ts
          tests/functions.proClubStaffManagementIndexClosed.unit.test.ts

      - name: Verify staff management atomic Firestore adapter
        run: node --import tsx --test tests/functions.proClubStaffManagementFirestoreDataSource.unit.test.ts

      - name: Verify staff management client repository
        run: node --import tsx --test tests/proClubStaffManagementClient.unit.test.ts

      - name: Verify staff management UI policy and actions
        run: >-
          node --import tsx --test
          tests/proClubStaffManagementUiPolicy.unit.test.ts
          tests/proClubStaffRosterPortalContract.unit.test.ts

      - name: Verify staff lifecycle review server contract
        run: node --import tsx --test tests/functions.proClubStaffLifecycleReviewService.unit.test.ts

      - name: Verify staff lifecycle review client contract
        run: node --import tsx --test tests/proClubStaffLifecycleReviewClient.unit.test.ts

      - name: Verify staff lifecycle Reactivate and history UI
        run: node --import tsx --test tests/proClubStaffLifecycleUi.unit.test.ts

      - name: Rehearse approved staff management lifecycle
        run: node --import tsx --test tests/proClubStaffManagementLifecycleRehearsal.integration.test.ts

      - name: Verify staff management history client denial
        run: >-
          npx --no-install firebase emulators:exec
          --project demo-futverse-pro-club-staff-management-history
          --only firestore
          "node --import tsx --test tests/firestore.pro-club-staff-management-history.rules.test.ts"

      - name: Functions TypeScript build
        run: npm --prefix functions run build

      - name: TypeScript gate
        run: npm run lint

      - name: Production build with synthetic staging config only
        run: npm run build
