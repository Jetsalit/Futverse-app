name: Pro Club Custom Formation V1

on:
  pull_request:
    paths:
      - firestore.rules
      - src/lib/proClubStartingXI11v11.ts
      - src/lib/proClubMatchStartingXI.ts
      - src/lib/firestore/proClubMatchStartingXIRepository.ts
      - src/components/pro-club/operations/proClubStartingXIViewModel.ts
      - src/components/pro-club/operations/ProClubStartingXI11v11.tsx
      - src/components/pro-club/operations/ProClubMatchStartingXIWorkspace.tsx
      - tests/proClubStartingXI11v11.unit.test.ts
      - tests/proClubMatchStartingXI.unit.test.ts
      - tests/proClubMatchStartingXIRepository.unit.test.ts
      - tests/proClubMatchStartingXIUiWiring.unit.test.ts
      - tests/proClubStartingXITabletUx.unit.test.ts
      - tests/firestore.pro-club-match-starting-xi.rules.test.ts
      - .github/workflows/pro-club-custom-formation-v1.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Runtime provenance
        run: |
          node --version
          npm --version
          git rev-parse HEAD
          git status --short

      - name: Set up Java 21 for Firebase Emulator
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix functions ci --ignore-scripts

      - name: Custom Formation targeted tests
        run: >-
          node --experimental-test-module-mocks --import tsx --test --test-concurrency=1
          tests/proClubStartingXI11v11.unit.test.ts
          tests/proClubMatchStartingXI.unit.test.ts
          tests/proClubMatchStartingXIRepository.unit.test.ts
          tests/proClubMatchStartingXIUiWiring.unit.test.ts
          tests/proClubStartingXITabletUx.unit.test.ts
          tests/proClubGameModelUiWiring.unit.test.ts

      - name: Starting XI Firestore Rules regression
        run: >-
          npx firebase emulators:exec
          --project demo-futverse-pro-club-custom-formation-v1
          --only firestore
          "node --import tsx --test --test-concurrency=1 tests/firestore.pro-club-match-starting-xi.rules.test.ts"

      - name: Root TypeScript
        run: npm run lint

      - name: App build
        run: npm run build

      - name: Diff whitespace check
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
