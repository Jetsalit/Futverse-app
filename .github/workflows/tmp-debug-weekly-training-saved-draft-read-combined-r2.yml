name: tmp-debug-weekly-training-saved-draft-read-combined-r2

on:
  push:
    branches:
      - debug/weekly-training-saved-draft-read-r1

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exact original combined command
        id: combined
        continue-on-error: true
        run: node --import tsx --test tests/proClubWeeklyTrainingSavedDraftReadModel.unit.test.ts tests/proClubWeeklyTrainingSavedDraftReadAdapter.unit.test.ts tests/proClubWeeklyTrainingSavedDraftUiWiring.test.ts
      - name: Serialized combined command
        id: serial
        continue-on-error: true
        run: node --import tsx --test --test-concurrency=1 tests/proClubWeeklyTrainingSavedDraftReadModel.unit.test.ts tests/proClubWeeklyTrainingSavedDraftReadAdapter.unit.test.ts tests/proClubWeeklyTrainingSavedDraftUiWiring.test.ts
      - name: Persist conclusions
        if: always()
        run: |
          printf 'combined=%s\nserial=%s\n' '${{ steps.combined.outcome }}' '${{ steps.serial.outcome }}' > /tmp/conclusions.txt
          cat /tmp/conclusions.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saved-draft-read-combined-r2-conclusions
          path: /tmp/conclusions.txt
