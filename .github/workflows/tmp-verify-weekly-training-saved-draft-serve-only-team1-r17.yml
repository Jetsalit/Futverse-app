name: tmp-verify-weekly-training-saved-draft-serve-only-team1-r17
on:
  push:
    branches: [verify/weekly-training-saved-draft-serve-only-team1-r17]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: npm ci
      - run: npm --prefix functions ci
      - name: Provenance and exact product scope
        shell: bash
        run: |
          set -euo pipefail
          P=f83e63e784e9e3a939ec88e77fc44a5f1eeb3ba0
          B=380050170ad6780c6854925bb6a44d2424fe265b
          test "$(git rev-parse HEAD^^)" = "$P"
          test "$(git merge-base "$B" "$P")" = "$B"
          git diff --check "$B" "$P"
          mapfile -t files < <(git diff --name-only "$B" "$P" | sort)
          expected=(
            docs/PRO_CLUB_WEEKLY_TRAINING_SAVED_DRAFT_READ_V1_CONTRACT_FREEZE.md
            firebase.json
            firestore.indexes.json
            functions/src/proClubWeeklyTrainingDraftSave/service.ts
            src/components/pro-club/operations/ProClubRoleWorkspace.tsx
            src/components/pro-club/operations/WeeklyTrainingSavedDrafts.tsx
            src/config/runtimeCapabilities.ts
            src/lib/firestore/proClubWeeklyTrainingPersistence.ts
            src/lib/firestore/proClubWeeklyTrainingSavedDraftReadAdapter.ts
            src/lib/proClubWeeklyTrainingSavedDraftReadModel.ts
            tests/functions.proClubWeeklyTrainingDraftSave.integrityMetadata.test.ts
            tests/proClubWeeklyTrainingPersistence.unit.test.ts
            tests/proClubWeeklyTrainingSavedDraftReadAdapter.unit.test.ts
            tests/proClubWeeklyTrainingSavedDraftReadModel.unit.test.ts
            tests/proClubWeeklyTrainingSavedDraftUiWiring.test.ts
          )
          mapfile -t exp < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#files[@]}" -eq 15
          diff -u <(printf '%s\n' "${exp[@]}") <(printf '%s\n' "${files[@]}")
      - name: Executable Vite build capability probe
        run: node tests/audit.proClubWeeklyTrainingSavedDraftBuildGate.team1.mjs
      - name: Saved DRAFT serve-only gate order payload and persistence tests
        run: node --import tsx --test --test-concurrency=1 tests/proClubWeeklyTrainingSavedDraftReadModel.unit.test.ts tests/proClubWeeklyTrainingSavedDraftReadAdapter.unit.test.ts tests/proClubWeeklyTrainingSavedDraftUiWiring.test.ts tests/proClubWeeklyTrainingPersistence.unit.test.ts
      - name: Spark production readiness boundary
        run: node --import tsx --test tests/sparkProductionReadiness.unit.test.ts
      - name: Existing client Weekly Training regressions
        run: node --import tsx --test --test-concurrency=1 tests/proClubWeeklyTrainingDraftComposerModel.unit.test.ts tests/proClubWeeklyTrainingDraftSaveClient.unit.test.ts tests/proClubWeeklyTrainingDraftUiWiring.test.ts tests/proClubWeeklyTrainingStorageBounds.unit.test.ts
      - name: Server validator and callable regressions
        run: node --import tsx --test --test-concurrency=1 tests/functions.proClubWeeklyTrainingDraftSave.parity.test.ts tests/functions.proClubWeeklyTrainingDraftSave.callable.test.ts
      - name: Trusted server retry integrity and max-shape Emulator
        run: npx firebase emulators:exec --project demo-futverse-weekly-training-serve-only-r17 --only firestore "node --import tsx --test --test-concurrency=1 tests/functions.proClubWeeklyTrainingDraftSave.integrityMetadata.test.ts tests/functions.proClubWeeklyTrainingDraftSave.maxShape.test.ts"
      - name: Weekly Training Firestore Rules regression
        run: npx firebase emulators:exec --project demo-futverse-pro-club-weekly-training-root --only firestore "node --import tsx --test tests/firestore.pro-club-weekly-training-root.rules.test.ts"
      - name: Functions TypeScript build
        run: npm --prefix functions run build
      - name: TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Safety boundary
        shell: bash
        run: |
          set -euo pipefail
          B=380050170ad6780c6854925bb6a44d2424fe265b
          P=f83e63e784e9e3a939ec88e77fc44a5f1eeb3ba0
          test -z "$(git diff --name-only "$B" "$P" | grep -E '^(firestore\.rules|\.firebaserc|functions/src/index\.ts)$' || true)"
          mapfile -t function_files < <(git diff --name-only "$B" "$P" | grep '^functions/src/' || true)
          test "${#function_files[@]}" -eq 1
          test "${function_files[0]}" = "functions/src/proClubWeeklyTrainingDraftSave/service.ts"
          grep -q 'PRODUCTION_WEEKLY_TRAINING_SAVED_DRAFT_INDEX_VERIFIED = false as const' src/config/runtimeCapabilities.ts
          grep -q 'hot !== undefined' src/config/runtimeCapabilities.ts
          ! grep -q 'env.*DEV' src/config/runtimeCapabilities.ts
          ! grep -q 'process\.env' src/config/runtimeCapabilities.ts
          grep -q 'Saved DRAFT history pending production index verification' src/components/pro-club/operations/ProClubRoleWorkspace.tsx
          echo PRODUCTION_SAVED_DRAFT_READ_ENABLED=NO
          echo PRODUCTION_INDEX_DEPLOYED=NO
          echo PRODUCTION_DEPLOYED=NO
          echo PRODUCTION_CALLABLE_INVOKED=NO
          echo PRODUCTION_DATA_WRITTEN=NO
          echo BILLING_PLAN_CHANGED=NO
