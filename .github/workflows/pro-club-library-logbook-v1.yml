name: Pro Club Library and Logbook V1

on:
  push:
    branches:
      - feat/pro-club-library-logbook-v1
    paths:
      - docs/PRO_CLUB_LIBRARY_LOGBOOK_V1_CONTRACT.md
      - src/lib/proClubLibraryLogbook.ts
      - src/components/pro-club/operations/ProClubLibraryLogbook.tsx
      - src/components/pro-club/operations/ProClubTeamDashboard.tsx
      - tests/proClubLibraryLogbookV1Contract.test.ts
      - tests/proClubLibraryLogbookModel.unit.test.ts
      - tests/proClubLibraryLogbookUi.unit.test.tsx
      - tests/proClubTeamDashboardProductionV1.unit.test.tsx
      - .github/workflows/pro-club-library-logbook-v1.yml
  pull_request:
    paths:
      - docs/PRO_CLUB_LIBRARY_LOGBOOK_V1_CONTRACT.md
      - src/lib/proClubLibraryLogbook.ts
      - src/components/pro-club/operations/ProClubLibraryLogbook.tsx
      - src/components/pro-club/operations/ProClubTeamDashboard.tsx
      - tests/proClubLibraryLogbookV1Contract.test.ts
      - tests/proClubLibraryLogbookModel.unit.test.ts
      - tests/proClubLibraryLogbookUi.unit.test.tsx
      - tests/proClubTeamDashboardProductionV1.unit.test.tsx
      - .github/workflows/pro-club-library-logbook-v1.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify raw HEAD checkout
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected="${{ github.event.pull_request.head.sha }}"
          else
            expected="${{ github.sha }}"
          fi
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_RAW_HEAD=$expected"
          echo "ACTUAL_CHECKOUT_HEAD=$actual"
          test "$actual" = "$expected"
          echo "RAW_HEAD_CHECKOUT=PASS"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install locked Functions dependencies
        run: npm --prefix functions ci --ignore-scripts

      - name: Library and Logbook targeted tests
        run: >-
          node --experimental-test-module-mocks --import tsx --test
          tests/proClubLibraryLogbookV1Contract.test.ts
          tests/proClubLibraryLogbookModel.unit.test.ts
          tests/proClubLibraryLogbookUi.unit.test.tsx
          tests/proClubTeamDashboardProductionV1.unit.test.tsx

      - name: Drill and Staff Submissions regression
        run: >-
          node --experimental-test-module-mocks --import tsx --test
          tests/drillDataModel.test.ts
          tests/drillRenderingContract.test.ts
          tests/proClubTrainingTacticBoardIntegration.unit.test.ts
          tests/proClubStaffSubmissionsModel.unit.test.ts
          tests/proClubStaffSubmissionsRepository.unit.test.ts
          tests/proClubStaffSubmissionsUi.unit.test.tsx

      - name: Root TypeScript
        run: npm run lint

      - name: App build
        run: npm run build

      - name: Diff whitespace check
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            git diff --check HEAD^ HEAD
          fi
