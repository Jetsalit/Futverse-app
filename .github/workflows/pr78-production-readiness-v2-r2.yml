name: PR78 Production Readiness V2 Gate R2

on:
  pull_request:
    paths:
      - ".github/workflows/pr78-production-readiness-v2-r2.yml"
      - "RELEASE_CHECKLIST.md"
      - "package.json"
      - "scripts/verifyProductionDeployReadiness.ts"
      - "tests/productionDeployReadinessV2.unit.test.ts"
      - "tests/proClubControlPlaneAppCheckHardening.contract.test.ts"
      - "firebase.json"
      - "functions/src/**"
      - "src/lib/proClubProvisioningControlPlaneApi.ts"

permissions:
  contents: read

jobs:
  exact-head-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm --prefix functions ci
      - name: Verify exact product head ancestry
        run: |
          git merge-base --is-ancestor 9a0ab615657487e8be1bab03da762251b552b6a0 HEAD
          test "$(git rev-parse 9a0ab615657487e8be1bab03da762251b552b6a0)" = "9a0ab615657487e8be1bab03da762251b552b6a0"
      - name: Production readiness V2 tests
        run: npm run test:production-deploy-readiness
      - name: Canonical App Check source-boundary contract
        run: node --import tsx --test tests/proClubControlPlaneAppCheckHardening.contract.test.ts
      - name: Canonical App Check guard blocks missing key
        shell: bash
        run: |
          set +e
          env -u VITE_RECAPTCHA_SITE_KEY -u VITE_APP_CHECK_DEBUG_TOKEN node scripts/verifyProductionAppCheck.mjs
          code=$?
          set -e
          test "$code" -ne 0
      - name: Full readiness command passes with temporary production-shaped key
        env:
          VITE_RECAPTCHA_SITE_KEY: 6Lc_pr78-r2-temporary-production-shaped-key
          VITE_APP_CHECK_DEBUG_TOKEN: ""
        run: npm run verify:production-deploy-readiness
      - run: npm --prefix functions run build
      - run: npm run lint
      - name: Production build with temporary production-shaped key
        env:
          VITE_RECAPTCHA_SITE_KEY: 6Lc_pr78-r2-temporary-production-shaped-key
          VITE_APP_CHECK_DEBUG_TOKEN: ""
        run: npm run build
      - run: git diff --check 20f422dc282c5d801d28ea713b12afe27d4b2b45..9a0ab615657487e8be1bab03da762251b552b6a0
      - run: test -z "$(git status --porcelain=v1)"
