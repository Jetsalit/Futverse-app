name: PR62 Combined Validation

on:
  push:
    branches:
      - audit/pr62-combined-validation-20260906

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout exact combined tree
        run: git checkout --detach 98d7c0940020358d1c494f8bc7267c3705fb1d9a
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install functions dependencies
        run: npm --prefix functions ci
      - name: Verify exact regression files
        run: |
          test -f tests/firestore.pro-club-onboarding.rules.test.ts
          test -f tests/firestore.pro-club-onboarding-read.rules.test.ts
          test -f tests/firestore.pro-club-claimant-identity.rules.test.ts
          test -f tests/firestore.pro-club.rules.test.ts
          test -f tests/proClubOnboardingRuntime.test.ts
          test -f tests/proClubStaffInvitationRuntime.test.ts
      - name: Focused role model
        run: node --import tsx --test tests/proClubStaffManagementModel.unit.test.ts
      - name: Contract and foundation regression
        run: node --import tsx --test tests/proClubAuthorityContract.test.ts tests/proClubFoundation.test.ts tests/proClubInviteClaimMembershipRulesDataContractV1.test.ts tests/proClubOrganizationAdapterContract.test.ts tests/proClubStaffOnboardingV1Contract.test.ts
      - name: Firestore Pro Club onboarding Rules
        run: npx --no-install firebase emulators:exec --project demo-futverse-pro-club-pr62 --only firestore "node --import tsx --test tests/firestore.pro-club-onboarding.rules.test.ts"
      - name: Firestore Pro Club onboarding read Rules
        run: npx --no-install firebase emulators:exec --project demo-futverse-pro-club-pr62 --only firestore "node --import tsx --test tests/firestore.pro-club-onboarding-read.rules.test.ts"
      - name: Firestore Pro Club claimant identity Rules
        run: npx --no-install firebase emulators:exec --project demo-futverse-pro-club-pr62 --only firestore "node --import tsx --test tests/firestore.pro-club-claimant-identity.rules.test.ts"
      - name: Firestore Pro Club base Rules
        run: npx --no-install firebase emulators:exec --project demo-futverse-pro-club-pr62 --only firestore "node --import tsx --test tests/firestore.pro-club.rules.test.ts"
      - name: Pro Club onboarding runtime
        run: npx --no-install firebase emulators:exec --project demo-futverse-pro-club-pr62 --only firestore "node --import tsx --test tests/proClubOnboardingRuntime.test.ts"
      - name: Pro Club staff invitation runtime
        run: npx --no-install firebase emulators:exec --project demo-futverse-pro-club-pr62 --only firestore "node --import tsx --test tests/proClubStaffInvitationRuntime.test.ts"
      - name: TypeScript
        run: npm run lint
      - name: Functions build
        run: npm --prefix functions run build
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check ead0f29c64e1e2ab473699012fc7828965b8db9b..98d7c0940020358d1c494f8bc7267c3705fb1d9a
