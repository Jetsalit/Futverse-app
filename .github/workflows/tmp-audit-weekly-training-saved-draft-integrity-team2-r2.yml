name: tmp-audit-weekly-training-saved-draft-integrity-team2-r2
on:
  push:
    branches: [audit/weekly-training-saved-draft-integrity-team2-r2]
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: npm ci
      - run: npm --prefix functions ci
      - name: Exact product head and audit-only delta
        shell: bash
        run: |
          set -euo pipefail
          P=ca6d38ce6062f860d48d68373572daf27d858282
          B=380050170ad6780c6854925bb6a44d2424fe265b
          test "$(git rev-parse HEAD^^)" = "$P"
          test "$(git merge-base "$B" "$P")" = "$B"
          mapfile -t delta < <(git diff --name-only "$P" HEAD | sort)
          expected=(.github/workflows/tmp-audit-weekly-training-saved-draft-integrity-team2-r2.yml tests/audit.proClubWeeklyTrainingSavedDraftIntegrity.team2.test.ts)
          mapfile -t exp < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#delta[@]}" -eq 2
          diff -u <(printf '%s\n' "${exp[@]}") <(printf '%s\n' "${delta[@]}")
          git diff --check "$B" "$P"
      - name: Independent adversarial integrity audit
        run: node --import tsx --test tests/audit.proClubWeeklyTrainingSavedDraftIntegrity.team2.test.ts
      - name: Product saved-DRAFT and persistence tests
        run: node --import tsx --test --test-concurrency=1 tests/proClubWeeklyTrainingSavedDraftReadModel.unit.test.ts tests/proClubWeeklyTrainingSavedDraftReadAdapter.unit.test.ts tests/proClubWeeklyTrainingSavedDraftUiWiring.test.ts tests/proClubWeeklyTrainingPersistence.unit.test.ts
      - name: Existing client regressions
        run: node --import tsx --test --test-concurrency=1 tests/proClubWeeklyTrainingDraftComposerModel.unit.test.ts tests/proClubWeeklyTrainingDraftSaveClient.unit.test.ts tests/proClubWeeklyTrainingDraftUiWiring.test.ts tests/proClubWeeklyTrainingStorageBounds.unit.test.ts
      - name: Server validator and callable regressions
        run: node --import tsx --test --test-concurrency=1 tests/functions.proClubWeeklyTrainingDraftSave.parity.test.ts tests/functions.proClubWeeklyTrainingDraftSave.callable.test.ts
      - name: Trusted server integrity max-shape and rollback Emulator
        run: npx firebase emulators:exec --project demo-futverse-weekly-training-integrity-team2-r2 --only firestore "node --import tsx --test --test-concurrency=1 tests/functions.proClubWeeklyTrainingDraftSave.integrityMetadata.test.ts tests/functions.proClubWeeklyTrainingDraftSave.maxShape.test.ts"
      - name: Firestore Rules regression
        run: npx firebase emulators:exec --project demo-futverse-pro-club-weekly-training-root --only firestore "node --import tsx --test tests/firestore.pro-club-weekly-training-root.rules.test.ts"
      - name: Functions build
        run: npm --prefix functions run build
      - name: TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Independent safety boundary
        shell: bash
        run: |
          set -euo pipefail
          B=380050170ad6780c6854925bb6a44d2424fe265b
          P=ca6d38ce6062f860d48d68373572daf27d858282
          test -z "$(git diff --name-only "$B" "$P" | grep -E '^(firestore\.rules|firebase\.json|\.firebaserc|functions/src/index\.ts|src/config/runtimeCapabilities\.ts)$' || true)"
          test "$(git diff --name-only "$B" "$P" | grep '^functions/src/' | wc -l)" -eq 1
          test "$(git diff --name-only "$B" "$P" | grep '^functions/src/')" = "functions/src/proClubWeeklyTrainingDraftSave/service.ts"
          echo PRODUCTION_DEPLOYED=NO
          echo PRODUCTION_CALLABLE_INVOKED=NO
          echo PRODUCTION_DATA_WRITTEN=NO
          echo BILLING_PLAN_CHANGED=NO
