name: Verify Weekly Training Production Persistence Foundation V1 R1

on:
  push:
    branches:
      - verify/pro-club-weekly-training-production-persistence-foundation-v1-r1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout verification HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact product parent and isolated scope
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_HEAD="1982575013a7b32f9c7e384579218dc08a3b5e13"
          PRODUCT_BASE="9ac3596ab091a534d11a43523a65760a0d939c6f"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_HEAD"
          test "$(git merge-base "$PRODUCT_BASE" "$PRODUCT_HEAD")" = "$PRODUCT_BASE"
          mapfile -t files < <(git diff --name-only "$PRODUCT_BASE" "$PRODUCT_HEAD" | sort)
          expected=(
            "docs/PRO_CLUB_WEEKLY_TRAINING_PRODUCTION_PERSISTENCE_FOUNDATION_V1_DESIGN_AUDIT.md"
            "tests/firestore.pro-club-weekly-training-production-persistence-foundation-v1.feasibility.test.ts"
            "tests/fixtures/firestore.pro-club-weekly-training.production-persistence-foundation-v1.rules"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#files[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!files[@]}"; do test "${files[$i]}" = "${expected_sorted[$i]}"; done
          ! git diff --name-only "$PRODUCT_BASE" "$PRODUCT_HEAD" | grep -E '^(src/|functions/|firestore\.rules$|firebase\.json$|firebase\.spark\.json$|package(-lock)?\.json$)'
          git diff --check "$PRODUCT_BASE" "$PRODUCT_HEAD"

      - name: Select preinstalled Java 21
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JAVA_HOME_21_X64"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version

      - name: Install locked root dependencies
        run: npm ci --ignore-scripts

      - name: Production persistence feasibility emulator
        run: >-
          npx --no-install firebase emulators:exec
          --project demo-futverse-weekly-training-production-persistence-v1
          --only firestore
          "node --import tsx --test --test-concurrency=1 tests/firestore.pro-club-weekly-training-production-persistence-foundation-v1.feasibility.test.ts"

      - name: Existing Weekly Training root Rules regression
        run: >-
          npx --no-install firebase emulators:exec
          --project demo-futverse-weekly-training-root-regression
          --only firestore
          "node --import tsx --test --test-concurrency=1 tests/firestore.pro-club-weekly-training-root.rules.test.ts"

      - name: Production activation contract regression
        run: node --import tsx --test tests/proClubWeeklyTrainingProductionActivationV1Contract.test.ts

      - name: Saved-DRAFT read regressions
        run: >-
          node --import tsx --test
          tests/proClubWeeklyTrainingSavedDraftReadModel.test.ts
          tests/proClubWeeklyTrainingSavedDraftReadAdapter.test.ts
          tests/proClubWeeklyTrainingSavedDraftUiWiring.test.ts

      - name: Root TypeScript
        run: npx --no-install tsc --noEmit

      - name: App build
        run: npm run build

      - name: Five-question and safety gate
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_HEAD="1982575013a7b32f9c7e384579218dc08a3b5e13"
          PRODUCT_BASE="9ac3596ab091a534d11a43523a65760a0d939c6f"
          VERIFY_FILE=".github/workflows/verify-weekly-training-production-persistence-foundation-v1-r1.yml"
          test "$(git diff --name-only "$PRODUCT_HEAD" HEAD)" = "$VERIFY_FILE"
          ! git diff "$PRODUCT_BASE" "$PRODUCT_HEAD" -- package.json package-lock.json functions/package.json functions/package-lock.json | grep -q .
          ! git diff "$PRODUCT_BASE" "$PRODUCT_HEAD" | grep -E '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AIza[0-9A-Za-z_-]{20,}|gh[pousr]_[0-9A-Za-z]{20,})'
          grep -Fq 'PLAN_ID=requestId' docs/PRO_CLUB_WEEKLY_TRAINING_PRODUCTION_PERSISTENCE_FOUNDATION_V1_DESIGN_AUDIT.md
          grep -Fq 'schema-v2 create-only' docs/PRO_CLUB_WEEKLY_TRAINING_PRODUCTION_PERSISTENCE_FOUNDATION_V1_DESIGN_AUDIT.md
          grep -Fq 'RUNTIME_ACTIVATION=NOT_AUTHORIZED' docs/PRO_CLUB_WEEKLY_TRAINING_PRODUCTION_PERSISTENCE_FOUNDATION_V1_DESIGN_AUDIT.md
          grep -Fq 'PRODUCTION_DATA_WRITE=NOT_AUTHORIZED' docs/PRO_CLUB_WEEKLY_TRAINING_PRODUCTION_PERSISTENCE_FOUNDATION_V1_DESIGN_AUDIT.md
          echo 'INPUT=PASS'
          echo 'AUTHORIZATION=PASS'
          echo 'SECRET=PASS'
          echo 'DEPENDENCY=N/A (NO CHANGE)'
          echo 'FAILURE_BEHAVIOR=PASS'
          echo 'PRODUCTION_DEPLOY=NO'
          echo 'PRODUCTION_DATA_WRITE=NO'
