name: Pro Club Weekly Planner UI V1 TEMP

on:
  push:
    branches:
      - feat/pro-club-weekly-planner-ui-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Runtime provenance
        run: |
          node --version
          npm --version
          git rev-parse HEAD
          git status --short

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix functions ci --ignore-scripts

      - name: Weekly planner targeted contracts
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/proClubWeeklyPlannerUiModel.unit.test.ts
            tests/proClubWeeklyPlannerBoardUi.unit.test.tsx
            tests/proClubWeeklyPeriodizationBoardUi.unit.test.tsx
            tests/proClubWeeklyTrainingSavedDraftUiWiring.test.ts
            tests/proClubHeadCoachWeeklyProductionVisibilityV1.unit.test.tsx
            tests/proClubTeamDashboardProductionV1.unit.test.tsx
            tests/proClubMembershipDiscoveryPortal.unit.test.tsx
          )
          existing=()
          for test_file in "${tests[@]}"; do
            if [ -f "$test_file" ]; then
              existing+=("$test_file")
            fi
          done
          printf 'RUNNING_TESTS=%s\n' "${existing[*]}"
          node --experimental-test-module-mocks --import tsx --test "${existing[@]}"

      - name: Root TypeScript
        run: npm run lint

      - name: App build
        run: npm run build

      - name: Diff whitespace check
        run: git diff --check HEAD^ HEAD
