name: PR64 Emulator Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pr64-emulator-gate.yml"
      - "functions/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  firestore-emulator-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install root dependencies
        run: npm ci

      - name: Verify exact PR64 source commit ancestry
        run: |
          git rev-parse HEAD
          git status --porcelain=v1
          git merge-base --is-ancestor 58ef8dbb8043e10412af60da7083ff48c9831e68 HEAD

      - name: Run audit verification Firestore emulator suite
        run: npx firebase emulators:exec --project demo-futverse-pro-club-audit-verification --only firestore "node --import tsx --test tests/firestore.pro-club-provisioning-audit-verification.service.test.ts"

      - name: Run predecessor provisioning Firestore emulator suite
        run: npx firebase emulators:exec --project demo-futverse-pro-club-provisioning --only firestore "node --import tsx --test tests/firestore.pro-club-provisioning.service.test.ts"

      - name: Verify repository remained unmodified
        run: |
          git diff --check
          git status --porcelain=v1
