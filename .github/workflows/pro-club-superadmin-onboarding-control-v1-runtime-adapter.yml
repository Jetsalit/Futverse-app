name: Pro Club SuperAdmin Onboarding Control V1 Runtime Adapter

on:
  push:
    branches:
      - feat/pro-club-superadmin-onboarding-control-v1-runtime-adapter
    paths:
      - src/lib/firestore/proClubSuperAdminOnboardingControlRepository.ts
      - tests/proClubSuperAdminOnboardingControlRuntime.test.ts
      - .github/workflows/pro-club-superadmin-onboarding-control-v1-runtime-adapter.yml
  pull_request:
    paths:
      - src/lib/firestore/proClubSuperadmin-onboarding-control-v1-runtime-adapter.yml
      - src/lib/firestore/proClubSuperAdminOnboardingControlRepository.ts
      - tests/proClubSuperAdminOnboardingControlRuntime.test.ts
      - .github/workflows/pro-club-superadmin-onboarding-control-v1-runtime-adapter.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select preinstalled Java 21
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JAVA_HOME_21_X64"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version

      - name: Install locked root dependencies
        run: npm ci --ignore-scripts

      - name: Install locked Functions dependencies
        run: npm --prefix functions ci --ignore-scripts

      - name: Runtime adapter Firestore emulator
        run: >-
          npx --no-install firebase emulators:exec
          --project demo-futverse-pro-club-superadmin-runtime-v1
          --only firestore
          "node --import tsx --test --test-concurrency=1 tests/proClubSuperAdminOnboardingControlRuntime.test.ts"

      - name: Existing Pro Club emulator regression
        run: npm run test:pro-club-emulator-regression

      - name: Root TypeScript
        run: npx --no-install tsc --noEmit

      - name: App build
        run: npm run build

      - name: Diff whitespace check
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            git diff --check HEAD^ HEAD
          fi
