name: Temporary Weekly Training Draft Save Atomic R1

on:
  push:
    branches:
      - verify/weekly-training-draft-save-atomic-r1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/weekly-training-draft-save-atomic-r1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install root and Functions dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Contract tests
        run: node --import tsx --test tests/proClubWeeklyTrainingDraftSaveV1Contract.test.ts

      - name: Atomic create proof against real root rules
        run: npx firebase-tools emulators:exec --only firestore --project demo-futverse-pro-club-weekly-training-atomic-create "node --import tsx --test tests/firestore.pro-club-weekly-training-atomic-create.rules.test.ts"

      - name: Existing Weekly Training regressions
        run: |
          node --import tsx --test tests/proClubWeeklyTraining.unit.test.ts
          node --import tsx --test tests/proClubWeeklyTrainingPersistence.unit.test.ts
          npx firebase-tools emulators:exec --only firestore --project demo-futverse-pro-club-weekly-training-root "node --import tsx --test tests/firestore.pro-club-weekly-training-foundation.rules.test.ts tests/firestore.pro-club-weekly-training-root.rules.test.ts"

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Functions build
        run: npm --prefix functions run build

      - name: Production build
        run: npm run build

      - name: Exact product scope and preservation
        shell: bash
        run: |
          git diff --check 0fcd06911a8c6a35929bc2d0ae7ddf0ec5c868f2...d8a03d73f3aee47e1d6047fd65b2939f99692121
          FILES="$(git diff --name-only 0fcd06911a8c6a35929bc2d0ae7ddf0ec5c868f2...d8a03d73f3aee47e1d6047fd65b2939f99692121)"
          EXPECTED=$'docs/PRO_CLUB_WEEKLY_TRAINING_DRAFT_SAVE_V1_CONTRACT_FREEZE.md\ntests/firestore.pro-club-weekly-training-atomic-create.rules.test.ts\ntests/proClubWeeklyTrainingDraftSaveV1Contract.test.ts'
          test "$FILES" = "$EXPECTED"
          test "$(git rev-parse d8a03d73f3aee47e1d6047fd65b2939f99692121^{parent}^{parent}^{parent})" = "0fcd06911a8c6a35929bc2d0ae7ddf0ec5c868f2"
