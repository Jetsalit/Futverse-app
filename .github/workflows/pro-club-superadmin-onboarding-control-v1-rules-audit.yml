name: Pro Club SuperAdmin Onboarding Control V1 Rules Audit

on:
  push:
    branches:
      - feat/pro-club-superadmin-onboarding-control-v1-rules-audit
  pull_request:
    paths:
      - "docs/PRO_CLUB_SUPERADMIN_ONBOARDING_CONTROL_V1_RULES_AUDIT_FOUNDATION.md"
      - "tests/fixtures/firestore.pro-club-superadmin-onboarding-control-v1.rules"
      - "tests/firestore.pro-club-superadmin-onboarding-control.rules.test.ts"
      - ".github/workflows/pro-club-superadmin-onboarding-control-v1-rules-audit.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select preinstalled Java 21
        run: |
          test -n "$JAVA_HOME_21_X64"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version

      - name: Install locked root dependencies
        run: npm ci --ignore-scripts

      - name: Install locked Functions dependencies
        run: npm --prefix functions ci --ignore-scripts

      - name: Verify contract foundation is still frozen
        run: node --import tsx --test tests/proClubSuperAdminOnboardingControlV1Contract.test.ts

      - name: Verify dedicated Firestore Rules foundation
        run: >-
          npx --no-install firebase emulators:exec
          --project demo-pro-club-superadmin-onboarding-control-v1
          --only firestore
          "node --import tsx --test --test-concurrency=1 tests/firestore.pro-club-superadmin-onboarding-control.rules.test.ts"

      - name: Root TypeScript
        run: npx --no-install tsc --noEmit

      - name: Functions build
        run: npm --prefix functions run build

      - name: PR diff whitespace check
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Push diff whitespace check
        if: github.event_name == 'push'
        run: git diff --check HEAD^ HEAD
