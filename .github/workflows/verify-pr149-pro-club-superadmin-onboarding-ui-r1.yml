name: Verify PR149 Pro Club SuperAdmin Onboarding UI R1

on:
  push:
    branches:
      - verify/pr149-pro-club-superadmin-onboarding-ui-r1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout verification HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact product parent and scope
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_HEAD="c0bb416c3c68c2192f42d505dc04883634a9f6f8"
          PRODUCT_BASE="f4233689a06eb0c7ff6b8b74bee8344df4d3957e"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_HEAD"
          test "$(git merge-base "$PRODUCT_BASE" "$PRODUCT_HEAD")" = "$PRODUCT_BASE"
          mapfile -t files < <(git diff --name-only "$PRODUCT_BASE" "$PRODUCT_HEAD" | sort)
          expected=(
            ".github/workflows/pro-club-superadmin-onboarding-control-v1-ui.yml"
            "src/components/superadmin/ProClubStaffOnboardingControlPlane.tsx"
            "src/components/superadmin/SuperAdminPortalNavigation.tsx"
            "tests/proClubSuperAdminOnboardingControlUi.test.ts"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#files[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!files[@]}"; do test "${files[$i]}" = "${expected_sorted[$i]}"; done
          git diff --check "$PRODUCT_BASE" "$PRODUCT_HEAD"

      - name: Select preinstalled Java 21
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JAVA_HOME_21_X64"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version

      - name: Install locked root dependencies
        run: npm ci --ignore-scripts

      - name: Install locked Functions dependencies
        run: npm --prefix functions ci --ignore-scripts

      - name: Focused UI authority contract
        run: node --import tsx --test tests/proClubSuperAdminOnboardingControlUi.test.ts

      - name: Remediated SuperAdmin runtime adapter emulator
        run: >-
          npx --no-install firebase emulators:exec
          --project demo-futverse-pro-club-superadmin-ui-verify-r1
          --only firestore
          "node --import tsx --test --test-concurrency=1 tests/proClubSuperAdminOnboardingControlRuntime.test.ts"

      - name: Existing Pro Club emulator regression
        run: npm run test:pro-club-emulator-regression

      - name: Root TypeScript
        run: npx --no-install tsc --noEmit

      - name: App build
        run: npm run build

      - name: Safety boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only c0bb416c3c68c2192f42d505dc04883634a9f6f8 HEAD)" = ".github/workflows/verify-pr149-pro-club-superadmin-onboarding-ui-r1.yml"
          ! git diff f4233689a06eb0c7ff6b8b74bee8344df4d3957e c0bb416c3c68c2192f42d505dc04883634a9f6f8 -- package.json package-lock.json functions/package.json functions/package-lock.json | grep -q .
          ! git diff f4233689a06eb0c7ff6b8b74bee8344df4d3957e c0bb416c3c68c2192f42d505dc04883634a9f6f8 | grep -E '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AIza[0-9A-Za-z_-]{20,}|gh[pousr]_[0-9A-Za-z]{20,})'
