name: Pro Club Theme V1

on:
  push:
    branches:
      - feat/pro-club-theme-v1
    paths:
      - src/components/pro-club/operations/ProClubTeamDashboard.tsx
      - src/components/pro-club/operations/proClubTheme.ts
      - src/index.css
      - tests/proClubThemeV1.unit.test.tsx
      - tests/proClubTeamDashboardProductionV1.unit.test.tsx
      - tests/proClubWeeklyPlannerBoardUi.unit.test.tsx
      - tests/proClubWeeklyPeriodizationBoardUi.unit.test.tsx
      - .github/workflows/pro-club-theme-v1.yml
  pull_request:
    paths:
      - src/components/pro-club/operations/ProClubTeamDashboard.tsx
      - src/components/pro-club/operations/proClubTheme.ts
      - src/index.css
      - tests/proClubThemeV1.unit.test.tsx
      - tests/proClubTeamDashboardProductionV1.unit.test.tsx
      - tests/proClubWeeklyPlannerBoardUi.unit.test.tsx
      - tests/proClubWeeklyPeriodizationBoardUi.unit.test.tsx
      - .github/workflows/pro-club-theme-v1.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Runtime provenance
        run: |
          node --version
          npm --version
          git rev-parse HEAD
          git status --short

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix functions ci --ignore-scripts

      - name: Theme and weekly planner regressions
        run: >-
          node --experimental-test-module-mocks --import tsx --test
          tests/proClubThemeV1.unit.test.tsx
          tests/proClubTeamDashboardProductionV1.unit.test.tsx
          tests/proClubWeeklyPlannerBoardUi.unit.test.tsx
          tests/proClubWeeklyPeriodizationBoardUi.unit.test.tsx

      - name: Root TypeScript
        run: npm run lint

      - name: App build
        run: npm run build

      - name: Diff whitespace check
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            git diff --check HEAD^ HEAD
          fi
