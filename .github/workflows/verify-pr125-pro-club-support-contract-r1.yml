name: PR125 Pro Club Support Contract Acceptance R1

on:
  pull_request:
    branches:
      - feat/pro-club-superadmin-support-mode-v1-contract

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact product head
        uses: actions/checkout@v4
        with:
          ref: 0ccc8a98088532a5e80131585a14b242fa8419c9
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Exact provenance and scope gate
        shell: bash
        run: |
          set -euo pipefail
          BASE=a983681bc89e93eb8759f583158d314ed772fb7d
          HEAD=0ccc8a98088532a5e80131585a14b242fa8419c9
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git merge-base "$BASE" "$HEAD")" = "$BASE"
          test "$(git rev-list --count "$BASE..$HEAD")" = "2"
          test "$(git rev-list --count "$HEAD..$BASE")" = "0"
          mapfile -t files < <(git diff --name-only "$BASE..$HEAD")
          test "${#files[@]}" = "2"
          printf '%s\n' "${files[@]}" | sort > /tmp/actual-files
          printf '%s\n' \
            docs/PRO_CLUB_SUPERADMIN_SUPPORT_MODE_V1_CONTRACT_FREEZE.md \
            tests/proClubSuperAdminSupportModeV1Contract.test.ts \
            | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --check "$BASE..$HEAD"

      - name: Contract tests
        run: node --import tsx --test tests/proClubSuperAdminSupportModeV1Contract.test.ts

      - name: TypeScript
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Safety boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE=a983681bc89e93eb8759f583158d314ed772fb7d
          HEAD=0ccc8a98088532a5e80131585a14b242fa8419c9
          forbidden='^(src/|functions/|firestore\.rules$|firestore\.indexes\.json$|firebase\.json$|firebase\.spark\.json$|package\.json$)'
          if git diff --name-only "$BASE..$HEAD" | grep -E "$forbidden"; then
            echo 'Forbidden product/runtime path changed.' >&2
            exit 1
          fi
          test -z "$(git status --porcelain)"
          echo 'PR125_CONTRACT_ACCEPTANCE=PASS'
          echo 'PRODUCTION_DEPLOYED=NO'
          echo 'PRODUCTION_HTTP_CALLED=NO'
          echo 'PRODUCTION_DATA_READ_WRITE=NO'
