name: Pro Club Training Card Board + Tactic V1

on:
  push:
    branches:
      - feat/pro-club-training-card-board-tactic-v1
    paths:
      - src/components/pro-club/ProClubPortal.tsx
      - src/components/pro-club/operations/ProClubHeadCoachWeeklyProductionWorkspace.tsx
      - src/components/pro-club/operations/ProClubTrainingDrillReferencePicker.tsx
      - src/components/pro-club/operations/WeeklyTrainingDraftComposer.tsx
      - src/components/pro-club/operations/WeeklyTrainingSavedDrafts.tsx
      - tests/proClubPortalDiscoveryLoading.unit.test.ts
      - tests/proClubTrainingTacticBoardIntegration.unit.test.ts
      - tests/proClubWeeklyTrainingCardBoardProduction.unit.test.ts
      - .github/workflows/pro-club-training-card-board-tactic-v1.yml
  pull_request:
    paths:
      - src/components/pro-club/ProClubPortal.tsx
      - src/components/pro-club/operations/ProClubHeadCoachWeeklyProductionWorkspace.tsx
      - src/components/pro-club/operations/ProClubTrainingDrillReferencePicker.tsx
      - src/components/pro-club/operations/WeeklyTrainingDraftComposer.tsx
      - src/components/pro-club/operations/WeeklyTrainingSavedDrafts.tsx
      - tests/proClubPortalDiscoveryLoading.unit.test.ts
      - tests/proClubTrainingTacticBoardIntegration.unit.test.ts
      - tests/proClubWeeklyTrainingCardBoardProduction.unit.test.ts
      - .github/workflows/pro-club-training-card-board-tactic-v1.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Runtime provenance
        run: |
          node --version
          npm --version
          git rev-parse HEAD
          git status --short

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix functions ci --ignore-scripts

      - name: Targeted Training + discovery contracts
        run: >-
          node --experimental-test-module-mocks --import tsx --test
          tests/proClubWeeklyTrainingCardBoardProduction.unit.test.ts
          tests/proClubTrainingTacticBoardIntegration.unit.test.ts
          tests/proClubPortalDiscoveryLoading.unit.test.ts
          tests/proClubHeadCoachWeeklyProductionVisibilityV1.unit.test.tsx
          tests/proClubWeeklyTrainingSavedDraftUiWiring.test.ts
          tests/proClubMembershipDiscoveryPortal.unit.test.tsx
          tests/drillOwnership.test.ts

      - name: Root TypeScript
        run: npm run lint

      - name: App build
        run: npm run build

      - name: Diff whitespace check
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            git diff --check HEAD^ HEAD
          fi
