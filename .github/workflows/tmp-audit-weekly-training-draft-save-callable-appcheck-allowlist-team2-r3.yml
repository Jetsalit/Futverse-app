name: Temporary Weekly Training Callable AppCheck Allowlist Team2 R3

on:
  push:
    branches:
      - audit/weekly-training-draft-save-callable-appcheck-allowlist-team2-r3

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact product head and audit-only delta
        shell: bash
        run: |
          set -euo pipefail
          BASE='90a92a8132b47a4c1800d024ca49146ed77923ce'
          PRODUCT_HEAD='5ed80b222e22516a704819a4841492592a077d1d'
          test "$(git rev-parse HEAD^^)" = "$PRODUCT_HEAD"
          test "$(git merge-base "$BASE" "$PRODUCT_HEAD")" = "$BASE"
          mapfile -t product_files < <(git diff --name-only "$BASE" "$PRODUCT_HEAD")
          expected_product=(
            'docs/PRO_CLUB_WEEKLY_TRAINING_DRAFT_SAVE_CALLABLE_APP_CHECK_V1_CONTRACT_FREEZE.md'
            'functions/src/index.ts'
            'functions/src/proClubWeeklyTrainingDraftSave/callableHandler.ts'
            'tests/functions.proClubWeeklyTrainingDraftSave.callable.test.ts'
          )
          test "${#product_files[@]}" -eq "${#expected_product[@]}"
          for i in "${!expected_product[@]}"; do test "${product_files[$i]}" = "${expected_product[$i]}"; done
          mapfile -t audit_files < <(git diff --name-only "$PRODUCT_HEAD" HEAD)
          expected_audit=(
            '.github/workflows/tmp-audit-weekly-training-draft-save-callable-appcheck-allowlist-team2-r3.yml'
            'tests/functions.proClubWeeklyTrainingDraftSave.team2.appAllowlist.test.ts'
          )
          test "${#audit_files[@]}" -eq "${#expected_audit[@]}"
          for i in "${!expected_audit[@]}"; do test "${audit_files[$i]}" = "${expected_audit[$i]}"; done
          git diff --check "$BASE" HEAD

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Functions build
        run: npm --prefix functions run build

      - name: Product callable tests
        run: node --import tsx --test tests/functions.proClubWeeklyTrainingDraftSave.callable.test.ts

      - name: Independent Team2 App Check allowlist tests
        run: node --import tsx --test tests/functions.proClubWeeklyTrainingDraftSave.team2.appAllowlist.test.ts

      - name: Weekly Training max-shape and rollback proof
        run: npx firebase-tools emulators:exec --only firestore --project demo-futverse-weekly-training-callable-appallowlist-r3 "node --import tsx --test tests/functions.proClubWeeklyTrainingDraftSave.maxShape.test.ts"

      - name: Weekly Training parity and pure regressions
        run: |
          node --import tsx --test tests/functions.proClubWeeklyTrainingDraftSave.parity.test.ts
          node --import tsx --test tests/proClubWeeklyTraining.unit.test.ts
          node --import tsx --test tests/proClubWeeklyTrainingPersistence.unit.test.ts

      - name: Root TypeScript and production build
        run: |
          npx tsc --noEmit
          npm run build

      - name: Safety boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^)" = '5ed80b222e22516a704819a4841492592a077d1d'
          echo 'PRODUCTION_DEPLOYED=NO'
          echo 'PRODUCTION_CALLABLE_INVOKED=NO'
          echo 'PRODUCTION_DATA_WRITTEN=NO'
          echo 'BILLING_PLAN_CHANGED=NO'
