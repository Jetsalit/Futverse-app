name: Temporary Pro Club SuperAdmin Root Rules Integrator

on:
  push:
    branches:
      - feat/pro-club-superadmin-onboarding-control-v1-root-rules
    paths:
      - scripts/applyProClubSuperAdminOnboardingRootRulesIntegration.mjs
      - .github/workflows/tmp-pro-club-superadmin-root-rules-integrator.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify branch and apply guarded transformation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "feat/pro-club-superadmin-onboarding-control-v1-root-rules"
          node scripts/applyProClubSuperAdminOnboardingRootRulesIntegration.mjs

      - name: Enforce exact mutation scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "NO_INTEGRATION_DIFF=YES"
            exit 0
          fi
          test "$changed" = "firestore.rules"
          git diff --check
          grep -F "function isProClubOnboardingControlActorV1(clubId)" firestore.rules >/dev/null
          grep -F "match /proClubOnboardingControlAudits/{actionId}" firestore.rules >/dev/null

      - name: Commit root Rules integration only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- firestore.rules; then
            echo "ROOT_RULES_COMMIT=SKIPPED_ALREADY_INTEGRATED"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- firestore.rules
          test "$(git diff --cached --name-only)" = "firestore.rules"
          git commit -m "feat(pro-club): integrate superadmin onboarding root rules"
          git push origin "HEAD:${GITHUB_REF_NAME}"
