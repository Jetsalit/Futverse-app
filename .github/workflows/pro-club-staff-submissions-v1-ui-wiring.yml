name: Pro Club Staff Submissions V1 UI Wiring

on:
  push:
    branches:
      - feat/pro-club-staff-submissions-v1-ui-wiring
    paths:
      - src/components/pro-club/operations/ProClubStaffSubmissions.tsx
      - src/components/pro-club/operations/ProClubTeamDashboard.tsx
      - src/components/pro-club/operations/ProClubHeadCoachWeeklyProductionWorkspace.tsx
      - tests/proClubStaffSubmissionsUi.unit.test.tsx
      - tests/proClubTeamDashboardProductionV1.unit.test.tsx
      - .github/workflows/pro-club-staff-submissions-v1-ui-wiring.yml
  pull_request:
    paths:
      - src/components/pro-club/operations/ProClubStaffSubmissions.tsx
      - src/components/pro-club/operations/ProClubTeamDashboard.tsx
      - src/components/pro-club/operations/ProClubHeadCoachWeeklyProductionWorkspace.tsx
      - tests/proClubStaffSubmissionsUi.unit.test.tsx
      - tests/proClubTeamDashboardProductionV1.unit.test.tsx
      - .github/workflows/pro-club-staff-submissions-v1-ui-wiring.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify raw HEAD checkout
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected="${{ github.event.pull_request.head.sha }}"
          else
            expected="${{ github.sha }}"
          fi
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_RAW_HEAD=$expected"
          echo "ACTUAL_CHECKOUT_HEAD=$actual"
          test "$actual" = "$expected"
          echo "RAW_HEAD_CHECKOUT=PASS"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Targeted Staff Submissions UI tests
        run: >-
          node --experimental-test-module-mocks --import tsx --test
          tests/proClubStaffSubmissionsUi.unit.test.tsx
          tests/proClubTeamDashboardProductionV1.unit.test.tsx
          tests/proClubWorkspaceRefreshPersistence.unit.test.ts

      - name: Staff Submissions model/repository regression
        run: >-
          node --experimental-test-module-mocks --import tsx --test
          tests/proClubStaffSubmissionsModel.unit.test.ts
          tests/proClubStaffSubmissionsRepository.unit.test.ts
          tests/proClubTechnicalGovernance.unit.test.ts

      - name: Root TypeScript
        run: npm run lint

      - name: App build
        run: npm run build

      - name: Diff whitespace check
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            git diff --check HEAD^ HEAD
          fi
