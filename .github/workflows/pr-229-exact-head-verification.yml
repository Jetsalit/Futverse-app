name: PR 229 Exact Head Verification

on:
  push:
    branches:
      - verify/pr-229-exact-head

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4e323a3541899984c3827d5c206e4259103d2ead
          persist-credentials: false
          fetch-depth: 0

      - name: Exact HEAD provenance
        shell: bash
        run: |
          set -euo pipefail
          expected="4e323a3541899984c3827d5c206e4259103d2ead"
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD=$expected"
          echo "ACTUAL_HEAD=$actual"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain)"
          echo "EXACT_HEAD_GATE=PASS"

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix functions ci --ignore-scripts

      - name: Targeted dual-role tests
        run: >-
          node --import tsx --test
          tests/proClubOwnerTechnicalDirectorDualRole.unit.test.ts
          tests/proClubTechnicalGovernance.unit.test.ts
          tests/proClubStaffManagementModel.unit.test.ts
          tests/localTrustedProClubOperations.unit.test.ts

      - name: Scope guard
        shell: bash
        run: |
          set -euo pipefail
          base="1bc808e25cfda97dd2d86b9ca4f92457fe041bec"
          head="4e323a3541899984c3827d5c206e4259103d2ead"
          changed="$(git diff --name-only "$base" "$head")"
          echo "$changed"
          if echo "$changed" | grep -Eq '^(firestore\.rules|firebase\.json|firebase\.spark\.json|src/components/)'; then
            echo "SCOPE_GUARD=FAIL"
            exit 1
          fi
          echo "SCOPE_GUARD=PASS"

      - name: TypeScript
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Diff whitespace check
        shell: bash
        run: git diff --check 1bc808e25cfda97dd2d86b9ca4f92457fe041bec 4e323a3541899984c3827d5c206e4259103d2ead
