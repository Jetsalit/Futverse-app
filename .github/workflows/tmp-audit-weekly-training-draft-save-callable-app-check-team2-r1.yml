name: Temporary Weekly Training Callable App Check Team2 R1

on:
  push:
    branches:
      - audit/weekly-training-draft-save-callable-app-check-v1-team2-r1

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact product head and audit-only delta
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_HEAD='07618e937efdaac983f48fd6a89a73f120a0b8de'
          test "$(git rev-parse HEAD^^)" = "$PRODUCT_HEAD"
          mapfile -t files < <(git diff --name-only "$PRODUCT_HEAD" HEAD)
          expected=(
            '.github/workflows/tmp-audit-weekly-training-draft-save-callable-app-check-team2-r1.yml'
            'tests/functions.proClubWeeklyTrainingDraftSave.team2.callable.test.ts'
          )
          test "${#files[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${files[$i]}" = "${expected[$i]}"; done
          git diff --check "$PRODUCT_HEAD" HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Functions build
        run: npm --prefix functions run build

      - name: Independent callable security tests
        run: node --import tsx --test tests/functions.proClubWeeklyTrainingDraftSave.team2.callable.test.ts

      - name: Existing callable tests
        run: node --import tsx --test tests/functions.proClubWeeklyTrainingDraftSave.callable.test.ts

      - name: Weekly Training max-shape and rollback proof
        run: npx firebase emulators:exec --only firestore --project demo-futverse "node --import tsx --test tests/functions.proClubWeeklyTrainingDraftSave.maxShape.test.ts"

      - name: Weekly Training parity regressions
        run: |
          node --import tsx --test tests/functions.proClubWeeklyTrainingDraftSave.parity.test.ts
          node --import tsx --test tests/proClubWeeklyTraining.test.ts

      - name: Root TypeScript and production build
        run: |
          npx tsc --noEmit
          npm run build

      - name: Safety boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = '90a92a8132b47a4c1800d024ca49146ed77923ce'
          echo 'PRODUCTION_DEPLOYED=NO'
          echo 'PRODUCTION_CALLABLE_INVOKED=NO'
          echo 'PRODUCTION_DATA_WRITTEN=NO'
          echo 'BILLING_PLAN_CHANGED=NO'
