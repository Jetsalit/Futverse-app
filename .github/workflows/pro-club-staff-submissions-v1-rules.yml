name: Pro Club Staff Submissions V1 Rules

on:
  push:
    branches:
      - feat/pro-club-staff-submissions-v1-rules
    paths:
      - firestore.rules
      - tests/firestore.pro-club-staff-submissions.rules.test.ts
      - src/lib/proClubStaffSubmissions.ts
      - src/lib/firestore/proClubStaffSubmissionsRepository.ts
      - .github/workflows/pro-club-staff-submissions-v1-rules.yml
  pull_request:
    paths:
      - firestore.rules
      - tests/firestore.pro-club-staff-submissions.rules.test.ts
      - src/lib/proClubStaffSubmissions.ts
      - src/lib/firestore/proClubStaffSubmissionsRepository.ts
      - .github/workflows/pro-club-staff-submissions-v1-rules.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify raw HEAD checkout
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected="${{ github.event.pull_request.head.sha }}"
          else
            expected="${{ github.sha }}"
          fi
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_RAW_HEAD=$expected"
          echo "ACTUAL_CHECKOUT_HEAD=$actual"
          test "$actual" = "$expected"
          echo "RAW_HEAD_CHECKOUT=PASS"

      - name: Select preinstalled Java 21
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JAVA_HOME_21_X64"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version

      - name: Install locked root dependencies
        run: npm ci --ignore-scripts

      - name: Install locked Functions dependencies
        run: npm --prefix functions ci --ignore-scripts

      - name: Dedicated Staff Submissions Rules emulator
        run: >-
          npx --no-install firebase emulators:exec
          --project demo-futverse-pro-club-staff-submissions-v1
          --only firestore
          "node --import tsx --test --test-concurrency=1 tests/firestore.pro-club-staff-submissions.rules.test.ts"

      - name: Reject Firestore expression-budget exhaustion
        shell: bash
        run: |
          set -euo pipefail
          test -f firestore-debug.log
          if grep -Fq "maximum of 1000 expressions to evaluate has been reached" firestore-debug.log; then
            echo "FAILURE_BEHAVIOR=FAIL"
            echo "REASON=Staff Submissions Firestore Rules expression budget exhausted"
            exit 1
          fi
          echo "FIRESTORE_EXPRESSION_BUDGET=PASS"

      - name: Existing Pro Club emulator regression
        run: npm run test:pro-club-emulator-regression

      - name: Membership Rules regression
        run: npm run test:rules

      - name: Root TypeScript
        run: npm run lint

      - name: App build
        run: npm run build

      - name: Diff whitespace check
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            git diff --check HEAD^ HEAD
          fi
