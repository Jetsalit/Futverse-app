name: Verify Weekly Training Production Persistence V1 R3

on:
  push:
    branches:
      - verify/pro-club-weekly-training-production-persistence-v1-r3

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout verification HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact product parent and isolated scope
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_HEAD="b580ee8c1a92f00863cbeb24c3c1fe8dfb02be04"
          PRODUCT_BASE="cf549c6d82e7960bb116c3fbd5b703cd4318c56a"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_HEAD"
          test "$(git merge-base "$PRODUCT_BASE" "$PRODUCT_HEAD")" = "$PRODUCT_BASE"
          mapfile -t files < <(git diff --name-only "$PRODUCT_BASE" "$PRODUCT_HEAD" | sort)
          expected=(
            "scripts/applyProClubWeeklyTrainingProductionPersistenceV1Rules.mjs"
            "src/components/pro-club/operations/WeeklyTrainingDraftComposer.tsx"
            "src/config/runtimeCapabilities.ts"
            "src/lib/firestore/proClubWeeklyTrainingProductionPersistence.ts"
            "src/lib/proClubWeeklyTrainingDraftSaveClient.ts"
            "tests/firestore.pro-club-weekly-training-production-persistence-v1.implementation.test.mjs"
            "tests/proClubWeeklyTrainingProductionActivationV1Contract.test.ts"
            "tests/proClubWeeklyTrainingProductionCapability.unit.test.ts"
            "tests/proClubWeeklyTrainingProductionPersistence.unit.test.ts"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#files[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!files[@]}"; do test "${files[$i]}" = "${expected_sorted[$i]}"; done
          ! git diff --name-only "$PRODUCT_BASE" "$PRODUCT_HEAD" | grep -E '^(functions/|firebase\.json$|firebase\.spark\.json$|package(-lock)?\.json$|firestore\.rules$)'
          git diff --check "$PRODUCT_BASE" "$PRODUCT_HEAD"

      - name: Select preinstalled Java 21
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JAVA_HOME_21_X64"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version

      - name: Install locked root dependencies
        run: npm ci --ignore-scripts

      - name: Install locked Functions dependencies
        run: npm --prefix functions ci --ignore-scripts

      - name: Production persistence client and capability unit tests
        run: >-
          node --import tsx --test
          tests/proClubWeeklyTrainingProductionPersistence.unit.test.ts
          tests/proClubWeeklyTrainingProductionCapability.unit.test.ts
          tests/proClubWeeklyTrainingDraftSaveClient.unit.test.ts

      - name: Exact generated-root production Rules emulator
        run: >-
          npx --no-install firebase emulators:exec
          --project demo-futverse-weekly-training-production-persistence-v1-r3
          --only firestore
          "node --test --test-concurrency=1 tests/firestore.pro-club-weekly-training-production-persistence-v1.implementation.test.mjs"

      - name: Existing Weekly Training root Rules regression
        run: >-
          npx --no-install firebase emulators:exec
          --project demo-futverse-weekly-training-root-regression-implementation-r3
          --only firestore
          "node --import tsx --test --test-concurrency=1 tests/firestore.pro-club-weekly-training-root.rules.test.ts"

      - name: Production activation contract regression
        run: node --import tsx --test tests/proClubWeeklyTrainingProductionActivationV1Contract.test.ts

      - name: Saved-DRAFT read regressions
        run: >-
          node --import tsx --test
          tests/proClubWeeklyTrainingSavedDraftReadModel.test.ts
          tests/proClubWeeklyTrainingSavedDraftReadAdapter.test.ts
          tests/proClubWeeklyTrainingSavedDraftUiWiring.test.ts

      - name: Functions build
        run: npm --prefix functions run build

      - name: Root TypeScript
        run: npx --no-install tsc --noEmit

      - name: App build
        run: npm run build

      - name: Five-question and safety gate
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_HEAD="b580ee8c1a92f00863cbeb24c3c1fe8dfb02be04"
          PRODUCT_BASE="cf549c6d82e7960bb116c3fbd5b703cd4318c56a"
          VERIFY_FILE=".github/workflows/verify-weekly-training-production-persistence-v1-r3.yml"
          test "$(git diff --name-only "$PRODUCT_HEAD" HEAD)" = "$VERIFY_FILE"
          ! git diff "$PRODUCT_BASE" "$PRODUCT_HEAD" -- package.json package-lock.json functions/package.json functions/package-lock.json | grep -q .
          ! git diff "$PRODUCT_BASE" "$PRODUCT_HEAD" | grep -E '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AIza[0-9A-Za-z_-]{20,}|gh[pousr]_[0-9A-Za-z]{20,})'
          grep -Fq 'PRODUCTION_WEEKLY_TRAINING_FRESH_DRAFT_RULES_VERIFIED = false' src/config/runtimeCapabilities.ts
          grep -Fq 'planId = input.requestId' src/lib/firestore/proClubWeeklyTrainingProductionPersistence.ts
          grep -Fq 'writeBatch(firestore)' src/lib/firestore/proClubWeeklyTrainingProductionPersistence.ts
          grep -Fq "'GAME'" scripts/applyProClubWeeklyTrainingProductionPersistenceV1Rules.mjs
          grep -Fq "'CONDITIONING'" scripts/applyProClubWeeklyTrainingProductionPersistenceV1Rules.mjs
          ! grep -Fq "'PHYSICAL'" scripts/applyProClubWeeklyTrainingProductionPersistenceV1Rules.mjs
          ! grep -Fq "'SMALL_SIDED_GAME'" scripts/applyProClubWeeklyTrainingProductionPersistenceV1Rules.mjs
          ! grep -Fq "'SET_PIECE'" scripts/applyProClubWeeklyTrainingProductionPersistenceV1Rules.mjs
          echo 'INPUT=PASS'
          echo 'AUTHORIZATION=PASS'
          echo 'SECRET=PASS'
          echo 'DEPENDENCY=N/A (NO CHANGE)'
          echo 'FAILURE_BEHAVIOR=PASS'
          echo 'PRODUCTION_CAPABILITY=FALSE'
          echo 'PRODUCTION_DEPLOY=NO'
          echo 'PRODUCTION_DATA_WRITE=NO'
