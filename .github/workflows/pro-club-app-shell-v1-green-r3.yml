name: Pro Club App Shell V1 GREEN R3

on:
  push:
    branches:
      - verify/pro-club-app-shell-v1-green-r3

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Runtime provenance
        run: |
          node --version
          npm --version
          git rev-parse HEAD
          git status --short

      - name: Exact product scope gate
        shell: bash
        run: |
          set -euo pipefail
          base="bcff4b6fddac13ed879f4785254d20cca854089c"
          product_head="HEAD^"
          mapfile -t changed < <(git diff --name-only "$base" "$product_head" | sort)
          expected=(
            "src/components/pro-club/ProClubPortal.tsx"
            "src/components/pro-club/operations/ProClubTeamDashboard.tsx"
            "tests/proClubHeadCoachWeeklyProductionVisibilityV1.unit.test.tsx"
            "tests/proClubMembershipDiscoveryPortal.unit.test.tsx"
            "tests/proClubTeamDashboardProductionV1.unit.test.tsx"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          printf 'CHANGED=%s\n' "${changed[*]}"
          if [ "${changed[*]}" != "${expected_sorted[*]}" ]; then
            echo "SCOPE_GATE=FAIL"
            exit 1
          fi
          echo "SCOPE_GATE=PASS"

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix functions ci --ignore-scripts

      - name: App Shell contract
        run: node --experimental-test-module-mocks --import tsx --test tests/proClubTeamDashboardProductionV1.unit.test.tsx

      - name: Portal loading contract
        run: node --experimental-test-module-mocks --import tsx --test tests/proClubPortalDiscoveryLoading.unit.test.ts

      - name: Membership discovery regression
        run: node --experimental-test-module-mocks --import tsx --test tests/proClubMembershipDiscoveryPortal.unit.test.tsx

      - name: Weekly visibility regression
        run: node --experimental-test-module-mocks --import tsx --test tests/proClubHeadCoachWeeklyProductionVisibilityV1.unit.test.tsx

      - name: Saved draft wiring regression
        run: node --experimental-test-module-mocks --import tsx --test tests/proClubWeeklyTrainingSavedDraftUiWiring.test.ts

      - name: Weekly card board regression
        run: node --experimental-test-module-mocks --import tsx --test tests/proClubWeeklyTrainingCardBoardProduction.unit.test.ts

      - name: Tactic integration regression
        run: node --experimental-test-module-mocks --import tsx --test tests/proClubTrainingTacticBoardIntegration.unit.test.ts

      - name: Drill ownership regression
        run: node --experimental-test-module-mocks --import tsx --test tests/drillOwnership.test.ts

      - name: Root TypeScript
        run: npm run lint

      - name: Production app build
        run: npm run build

      - name: Product diff whitespace check
        shell: bash
        run: git diff --check bcff4b6fddac13ed879f4785254d20cca854089c HEAD^
