name: Temporary Weekly Training Drill Unicode Team1 R7
on:
  push:
    branches:
      - verify/weekly-training-drill-unicode-team1-r7
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact product head and scope
        shell: bash
        run: |
          set -euo pipefail
          BASE='bf4f22446753cb9cdc56909f6acacc4790b5d201'
          PRODUCT_HEAD='a0e953396430a31868cc33a0ef49fc473869c8a0'
          test "$(git rev-parse HEAD^)" = "$PRODUCT_HEAD"
          test "$(git merge-base "$BASE" "$PRODUCT_HEAD")" = "$BASE"
          test "$(git diff --name-only "$BASE" "$PRODUCT_HEAD" | wc -l)" -eq 18
          git diff --check "$BASE" "$PRODUCT_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci
      - name: Functions build
        run: npm --prefix functions run build
      - name: Storage and Unicode validation tests
        run: |
          node --import tsx --test tests/proClubWeeklyTrainingStorageBounds.unit.test.ts
          node --import tsx --test tests/proClubWeeklyTrainingDraftSaveClient.unit.test.ts
          node --import tsx --test tests/functions.proClubWeeklyTrainingDraftSave.parity.test.ts
          node --import tsx --test tests/proClubWeeklyTrainingDraftUiWiring.test.ts
          node --import tsx --test tests/functions.proClubWeeklyTrainingDraftSave.callable.test.ts
      - name: Cross-tenant idempotency max-shape rollback proof
        run: npx firebase-tools emulators:exec --only firestore --project demo-futverse-weekly-training-unicode-team1-r7 "node --import tsx --test --test-concurrency=1 tests/functions.proClubWeeklyTrainingDraftSave.maxShape.test.ts"
      - name: Existing Weekly Training regressions
        run: |
          node --import tsx --test tests/proClubWeeklyTraining.unit.test.ts
          node --import tsx --test tests/proClubWeeklyTrainingPersistence.unit.test.ts
          node --import tsx --test tests/proClubWeeklyTrainingDraftComposerModel.unit.test.ts
      - name: Root TypeScript and production build
        run: |
          npx tsc --noEmit
          npm run build
      - name: Production safety boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only 'bf4f22446753cb9cdc56909f6acacc4790b5d201' 'a0e953396430a31868cc33a0ef49fc473869c8a0' | grep -Ec '^(firestore.rules|src/config/runtimeCapabilities.ts|src/lib/firebase.ts|functions/src/index.ts)$')" -eq 0
          echo 'PRODUCTION_DEPLOYED=NO'
          echo 'PRODUCTION_CALLABLE_INVOKED=NO'
          echo 'PRODUCTION_DATA_WRITTEN=NO'
          echo 'BILLING_PLAN_CHANGED=NO'
