name: PR136 Pro Club Player Squad Contract Acceptance R2

on:
  push:
    branches:
      - verify/pr136-pro-club-player-squad-contract-r2

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact product head
        uses: actions/checkout@v4
        with:
          ref: 212d93ec1bb9fb86a98b83305ae27537a0f3eca6
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Exact provenance and scope gate
        shell: bash
        run: |
          set -euo pipefail
          BASE=a983681bc89e93eb8759f583158d314ed772fb7d
          HEAD=212d93ec1bb9fb86a98b83305ae27537a0f3eca6
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git merge-base "$BASE" "$HEAD")" = "$BASE"
          test "$(git rev-list --count "$BASE..$HEAD")" = "3"
          test "$(git rev-list --count "$HEAD..$BASE")" = "0"
          mapfile -t files < <(git diff --name-only "$BASE..$HEAD")
          test "${#files[@]}" = "2"
          printf '%s\n' "${files[@]}" | sort > /tmp/actual
          printf '%s\n' \
            docs/PRO_CLUB_PLAYER_SQUAD_V1_CONTRACT_FREEZE.md \
            tests/proClubPlayerSquadV1Contract.test.ts \
            | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git diff --check "$BASE..$HEAD"

      - name: Player Squad V1 contract tests
        run: node --import tsx --test tests/proClubPlayerSquadV1Contract.test.ts

      - name: Player Profile read model regression
        run: node --import tsx --test tests/playerProfileReadModel.test.ts

      - name: Pro Club foundation regression
        run: node --import tsx --test tests/proClubFoundation.test.ts

      - name: Functions build
        run: npm --prefix functions run build

      - name: TypeScript
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Safety boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE=a983681bc89e93eb8759f583158d314ed772fb7d
          HEAD=212d93ec1bb9fb86a98b83305ae27537a0f3eca6
          forbidden='^(src/|functions/|firestore\.rules$|firestore\.indexes\.json$|firebase\.json$|firebase\.spark\.json$|package\.json$|\.github/)'
          if git diff --name-only "$BASE..$HEAD" | grep -E "$forbidden"; then
            echo 'Forbidden product/runtime path changed.' >&2
            exit 1
          fi
          test -z "$(git status --porcelain)"
          echo 'PR136_PLAYER_SQUAD_CONTRACT_ACCEPTANCE=PASS'
          echo 'PRODUCTION_DEPLOYED=NO'
          echo 'PRODUCTION_HTTP_CALLED=NO'
          echo 'PRODUCTION_DATA_READ_WRITE=NO'
