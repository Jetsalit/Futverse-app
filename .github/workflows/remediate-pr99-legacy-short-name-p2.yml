name: Remediate PR99 Legacy Short Name P2

on:
  push:
    branches:
      - remediate/pr99-legacy-short-name-p2-v1

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR99 product branch
        uses: actions/checkout@v4
        with:
          ref: fix/pro-club-known-state-verifier-p2-hardening-v1
          fetch-depth: 0

      - name: Prove exact pre-remediation head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7767ceb4ec04f7527a783f8c13c9d316dae3ab57"
          test -z "$(git status --short)"

      - name: Apply legacy short-name compatibility remediation
        shell: python
        run: |
          from pathlib import Path

          verifier_path = Path("scripts/verifyProductionProClubKnownState.ts")
          verifier = verifier_path.read_text(encoding="utf-8")
          old_guard = '  if (history.newShortName !== null && history.newShortName.length > MAX_RENAME_SHORT_NAME_LENGTH) return false;'
          new_guard = '''  if (
            history.newShortName !== null &&
            history.newShortName !== history.previousShortName &&
            history.newShortName.length > MAX_RENAME_SHORT_NAME_LENGTH
          ) return false;'''
          if verifier.count(old_guard) != 1:
              raise SystemExit("expected exactly one short-name length guard")
          verifier_path.write_text(verifier.replace(old_guard, new_guard), encoding="utf-8")

          test_path = Path("tests/productionProClubKnownStateVerifier.unit.test.ts")
          tests = test_path.read_text(encoding="utf-8")
          marker = 'test("rename history rejects no-op transitions that the trusted rename path cannot create", () => {'
          if tests.count(marker) != 1:
              raise SystemExit("expected exactly one no-op regression marker")
          regression = '''test("rename history permits an unchanged legacy short name over 32 characters", () => {
            const longShortName = "x".repeat(33);
            const legacyTarget: KnownStateTarget = {
              ...target,
              originalShortName: longShortName,
            };
            const baseAudit = makeAudit();
            const normalizedRequest = {
              ...baseAudit.normalizedRequest,
              shortName: longShortName,
            };
            const legacyAudit = {
              ...baseAudit,
              requestFingerprint: computeProvisioningRequestFingerprint(normalizedRequest),
              normalizedRequest,
            };
            const result = evaluateKnownState(makeInput({
              target: legacyTarget,
              audit: legacyAudit,
              club: {
                ...makeInput().club,
                name: "Lampang United",
                shortName: longShortName,
                updatedAt: "2026-09-08T03:00:00.000Z",
              },
              nameHistory: [renameRecord({
                previousShortName: longShortName,
                newShortName: longShortName,
              })],
            }));
            assert.equal(result.historyShapeValid, true);
            assert.equal(result.renameContinuityHealthy, true);
            assert.equal(result.overall, true);
          });

          '''
          test_path.write_text(tests.replace(marker, regression + marker), encoding="utf-8")

      - name: Scope and diff gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            "scripts/verifyProductionProClubKnownState.ts"
            "tests/productionProClubKnownStateVerifier.unit.test.ts"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Focused known-state verifier tests
        run: npm run test:production-pro-club-known-state

      - name: Pro Club emulator regression
        run: npm run test:pro-club-emulator-regression

      - name: TypeScript gate
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit remediation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verifyProductionProClubKnownState.ts tests/productionProClubKnownStateVerifier.unit.test.ts
          git commit -m "fix(pro-club): preserve unchanged legacy short names"
          test -z "$(git status --short)"

      - name: Push fast-forward to PR99 branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:fix/pro-club-known-state-verifier-p2-hardening-v1

      - name: Confirm no production action
        run: |
          echo 'PRODUCTION_DEPLOYED=NO'
          echo 'PRODUCTION_HTTP_CALLED=NO'
          echo 'PRODUCTION_DATA_WRITTEN=NO'
