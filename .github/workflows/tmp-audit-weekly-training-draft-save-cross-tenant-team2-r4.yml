name: Temporary Weekly Training Cross-Tenant Idempotency Team2 R4

on:
  push:
    branches:
      - audit/weekly-training-draft-save-cross-tenant-team2-r4

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact product head and audit-only delta
        shell: bash
        run: |
          set -euo pipefail
          BASE='bf4f22446753cb9cdc56909f6acacc4790b5d201'
          PRODUCT_HEAD='afa182d46e83de5780748ebd7e692278a5462572'
          test "$(git rev-parse HEAD^^)" = "$PRODUCT_HEAD"
          test "$(git merge-base "$BASE" "$PRODUCT_HEAD")" = "$BASE"
          mapfile -t audit_files < <(git diff --name-only "$PRODUCT_HEAD" HEAD)
          expected_audit=(
            '.github/workflows/tmp-audit-weekly-training-draft-save-cross-tenant-team2-r4.yml'
            'tests/proClubWeeklyTrainingDraftSave.team2.crossTenantIdempotency.test.ts'
          )
          test "${#audit_files[@]}" -eq "${#expected_audit[@]}"
          for i in "${!expected_audit[@]}"; do test "${audit_files[$i]}" = "${expected_audit[$i]}"; done
          git diff --check "$BASE" HEAD

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Functions build
        run: npm --prefix functions run build

      - name: Independent Team2 cross-tenant idempotency and registry security tests
        run: npx firebase-tools emulators:exec --only firestore --project demo-futverse-weekly-training-cross-tenant-team2-r4 "node --import tsx --test --test-concurrency=1 tests/proClubWeeklyTrainingDraftSave.team2.crossTenantIdempotency.test.ts"

      - name: Product client callable and UI tests
        run: |
          node --import tsx --test tests/proClubWeeklyTrainingDraftSaveClient.unit.test.ts
          node --import tsx --test tests/proClubWeeklyTrainingDraftComposerModel.unit.test.ts
          node --import tsx --test tests/proClubWeeklyTrainingDraftUiWiring.test.ts
          node --import tsx --test tests/functions.proClubWeeklyTrainingDraftSave.callable.test.ts

      - name: Product cross-tenant max-shape rollback proof
        run: npx firebase-tools emulators:exec --only firestore --project demo-futverse-weekly-training-cross-tenant-team2-r4-product "node --import tsx --test --test-concurrency=1 tests/functions.proClubWeeklyTrainingDraftSave.maxShape.test.ts"

      - name: Existing Weekly Training regressions
        run: |
          node --import tsx --test tests/functions.proClubWeeklyTrainingDraftSave.parity.test.ts
          node --import tsx --test tests/proClubWeeklyTraining.unit.test.ts
          node --import tsx --test tests/proClubWeeklyTrainingPersistence.unit.test.ts

      - name: Root TypeScript and production build
        run: |
          npx tsc --noEmit
          npm run build

      - name: Safety boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only 'bf4f22446753cb9cdc56909f6acacc4790b5d201' 'afa182d46e83de5780748ebd7e692278a5462572' | grep -Ec '^(firestore.rules|src/config/runtimeCapabilities.ts|src/lib/firebase.ts|functions/src/index.ts)$')" -eq 0
          echo 'PRODUCTION_DEPLOYED=NO'
          echo 'PRODUCTION_CALLABLE_INVOKED=NO'
          echo 'PRODUCTION_DATA_WRITTEN=NO'
          echo 'BILLING_PLAN_CHANGED=NO'
