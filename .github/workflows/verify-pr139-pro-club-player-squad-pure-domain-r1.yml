name: PR139 Pro Club Player Squad Pure Domain Acceptance R1

on:
  push:
    branches:
      - verify/pr139-pro-club-player-squad-pure-domain-r1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact product head
        uses: actions/checkout@v4
        with:
          ref: a7bacbebf6567a25651ebf392e799d2133276fff
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Exact provenance and scope gate
        shell: bash
        run: |
          set -euo pipefail
          BASE=212d93ec1bb9fb86a98b83305ae27537a0f3eca6
          HEAD=a7bacbebf6567a25651ebf392e799d2133276fff
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git merge-base "$BASE" "$HEAD")" = "$BASE"
          test "$(git rev-list --count "$BASE..$HEAD")" = "3"
          test "$(git rev-list --count "$HEAD..$BASE")" = "0"
          mapfile -t files < <(git diff --name-only "$BASE..$HEAD")
          test "${#files[@]}" = "3"
          printf '%s\n' "${files[@]}" | sort > /tmp/actual
          printf '%s\n' \
            docs/PRO_CLUB_PLAYER_SQUAD_V1_PURE_DOMAIN_FREEZE.md \
            src/lib/proClubPlayerSquad.ts \
            tests/proClubPlayerSquad.unit.test.ts \
            | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git diff --check "$BASE..$HEAD"

      - name: Player Squad pure domain unit tests
        run: node --import tsx --test tests/proClubPlayerSquad.unit.test.ts

      - name: Parent Player Squad contract regression
        run: node --import tsx --test tests/proClubPlayerSquadV1Contract.test.ts

      - name: Player Profile regression
        run: node --import tsx --test tests/playerProfileReadModel.test.ts

      - name: Pro Club foundation regression
        run: node --import tsx --test tests/proClubFoundation.test.ts

      - name: Functions build
        run: npm --prefix functions run build

      - name: TypeScript
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Safety boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE=212d93ec1bb9fb86a98b83305ae27537a0f3eca6
          HEAD=a7bacbebf6567a25651ebf392e799d2133276fff
          forbidden='^(functions/|firestore\.rules$|firestore\.indexes\.json$|firebase\.json$|firebase\.spark\.json$|src/components/|src/contexts/|src/App\.tsx$)'
          if git diff --name-only "$BASE..$HEAD" | grep -E "$forbidden"; then
            echo 'Forbidden runtime/integration path changed.' >&2
            exit 1
          fi
          test -z "$(git status --porcelain)"
          echo 'PR139_PLAYER_SQUAD_PURE_DOMAIN_ACCEPTANCE=PASS'
          echo 'PRODUCTION_DEPLOYED=NO'
          echo 'PRODUCTION_HTTP_CALLED=NO'
          echo 'PRODUCTION_DATA_READ_WRITE=NO'
