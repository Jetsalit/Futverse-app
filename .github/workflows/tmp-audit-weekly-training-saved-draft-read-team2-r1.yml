name: tmp-audit-weekly-training-saved-draft-read-team2-r1
on:
  push:
    branches: [audit/weekly-training-saved-draft-read-team2-r1]
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: npm ci
      - run: npm --prefix functions ci
      - name: Exact product head and audit-only delta
        shell: bash
        run: |
          set -euo pipefail
          P=0fbe62a4d5e43ade23350501fdbc3329ca634326
          B=380050170ad6780c6854925bb6a44d2424fe265b
          test "$(git merge-base "$B" "$P")" = "$B"
          git diff --check "$B" "$P"
          mapfile -t product < <(git diff --name-only "$B" "$P" | sort)
          test "${#product[@]}" -eq 8
          mapfile -t audit_delta < <(git diff --name-only "$P" HEAD | sort)
          expected=(.github/workflows/tmp-audit-weekly-training-saved-draft-read-team2-r1.yml tests/proClubWeeklyTrainingSavedDraftRead.team2.audit.test.ts)
          mapfile -t exp < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#audit_delta[@]}" -eq 2
          diff -u <(printf '%s\n' "${exp[@]}") <(printf '%s\n' "${audit_delta[@]}")
      - name: Independent adversarial read audit
        run: node --import tsx --test tests/proClubWeeklyTrainingSavedDraftRead.team2.audit.test.ts
      - name: Product saved DRAFT tests
        run: node --import tsx --test --test-concurrency=1 tests/proClubWeeklyTrainingSavedDraftReadModel.unit.test.ts tests/proClubWeeklyTrainingSavedDraftReadAdapter.unit.test.ts tests/proClubWeeklyTrainingSavedDraftUiWiring.test.ts
      - name: Weekly Training regressions
        run: node --import tsx --test --test-concurrency=1 tests/proClubWeeklyTrainingDraftComposerModel.unit.test.ts tests/proClubWeeklyTrainingDraftSaveClient.unit.test.ts tests/proClubWeeklyTrainingDraftUiWiring.test.ts tests/proClubWeeklyTrainingStorageBounds.unit.test.ts
      - name: Firestore Rules regression
        run: npx firebase emulators:exec --project demo-futverse-pro-club-weekly-training-root --only firestore "node --import tsx --test tests/firestore.pro-club-weekly-training-root.rules.test.ts"
      - name: TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Safety boundary
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only 380050170ad6780c6854925bb6a44d2424fe265b 0fbe62a4d5e43ade23350501fdbc3329ca634326 | grep -E '^(firestore\.rules|firebase\.json|\.firebaserc|functions/src/|src/config/runtimeCapabilities\.ts)$' || true)"
          echo PRODUCTION_DEPLOYED=NO
          echo PRODUCTION_DATA_WRITTEN=NO
          echo PRODUCTION_CALLABLE_INVOKED=NO
          echo BILLING_PLAN_CHANGED=NO
