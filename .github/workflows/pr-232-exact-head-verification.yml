name: PR 232 Exact Head Verification

on:
  push:
    branches:
      - verify/pr-232-exact-head

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8f30dbb4f3cb5d97fd45ad998fe0a740d033e1a6
          persist-credentials: false
          fetch-depth: 0

      - name: Exact HEAD provenance
        shell: bash
        run: |
          set -euo pipefail
          expected="8f30dbb4f3cb5d97fd45ad998fe0a740d033e1a6"
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD=$expected"
          echo "ACTUAL_HEAD=$actual"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain)"
          echo "EXACT_HEAD_GATE=PASS"

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix functions ci --ignore-scripts

      - name: Targeted Starting XI UI adapter tests
        run: >-
          node --import tsx --test
          tests/proClubStartingXI11v11.unit.test.ts
          tests/proClubStartingXI11v11V1Contract.test.ts
          tests/proClubStartingXIViewModel.unit.test.ts
          tests/proClubStartingXIUi.unit.test.tsx
          tests/proClubSquadRosterModel.unit.test.ts
          tests/proClubSquadRosterRepository.unit.test.ts

      - name: Scope guard
        shell: bash
        run: |
          set -euo pipefail
          base="2021313f62e7ad22b5f427d5cb05b52d5e43a36a"
          head="8f30dbb4f3cb5d97fd45ad998fe0a740d033e1a6"
          changed="$(git diff --name-only "$base" "$head")"
          echo "$changed"
          if echo "$changed" | grep -Eq '^(firestore\.rules|firebase\.json|firebase\.spark\.json|src/lib/firestore/|src/components/pro-club/operations/ProClubTeamDashboard\.tsx|src/components/StartingXIBuilder\.tsx)'; then
            echo "SCOPE_GUARD=FAIL"
            exit 1
          fi
          echo "SCOPE_GUARD=PASS"

      - name: No direct persistence or production wiring
        shell: bash
        run: |
          set -euo pipefail
          src="src/components/pro-club/operations/ProClubStartingXI11v11.tsx"
          if grep -Eq 'firebase/firestore|setDoc|addDoc|updateDoc|deleteDoc|writeBatch|runTransaction|httpsCallable' "$src"; then
            echo "DIRECT_WRITE_GUARD=FAIL"
            exit 1
          fi
          if grep -q 'ProClubStartingXI11v11' src/components/pro-club/operations/ProClubTeamDashboard.tsx; then
            echo "PRODUCTION_WIRING_GUARD=FAIL"
            exit 1
          fi
          echo "NO_PERSISTENCE_OR_PRODUCTION_WIRING=PASS"

      - name: TypeScript
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Diff whitespace check
        shell: bash
        run: git diff --check 2021313f62e7ad22b5f427d5cb05b52d5e43a36a 8f30dbb4f3cb5d97fd45ad998fe0a740d033e1a6
