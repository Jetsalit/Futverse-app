name: Temporary Verify Pro Club Weekly Training Server Draft Save V1

on:
  push:
    branches:
      - feat/pro-club-weekly-training-server-draft-save-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact main ancestor and scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0fcd06911a8c6a35929bc2d0ae7ddf0ec5c868f2 HEAD
          test "$(git merge-base 0fcd06911a8c6a35929bc2d0ae7ddf0ec5c868f2 HEAD)" = "0fcd06911a8c6a35929bc2d0ae7ddf0ec5c868f2"
          git diff --check 0fcd06911a8c6a35929bc2d0ae7ddf0ec5c868f2..HEAD

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Functions build
        run: npm --prefix functions run build

      - name: Max-shape server transaction proof
        run: >-
          npx firebase-tools emulators:exec --only firestore
          --project demo-futverse-server-weekly-training-draft-save-v1
          "node --import tsx --test tests/functions.proClubWeeklyTrainingDraftSave.maxShape.test.ts"

      - name: Existing Weekly Training pure regressions
        run: |
          node --import tsx --test tests/proClubWeeklyTraining.unit.test.ts
          node --import tsx --test tests/proClubWeeklyTrainingPersistence.unit.test.ts

      - name: Safety markers
        run: |
          echo 'PRODUCTION_DEPLOYED=NO'
          echo 'PRODUCTION_CALLABLE_INVOKED=NO'
          echo 'PRODUCTION_DATA_WRITTEN=NO'
          echo 'BILLING_PLAN_CHANGED=NO'
          echo 'FORCE_PUSH=NO'
