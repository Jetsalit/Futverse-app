name: TEMP Align Pro Club Support Read Regression

on:
  push:
    branches:
      - feat/pro-club-superadmin-support-read-v1-foundation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Exact pushed-head gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain)"

      - name: Replace only legacy test 3 expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("tests/firestore.pro-club.rules.test.ts")
          text = p.read_text(encoding="utf-8")
          start_marker = 'test(\n  "3. global SUPERADMIN without Pro Club membership gets no bypass",'
          end_marker = '\n\ntest(\n  "4. Academy ADMIN without Pro Club membership gets no fallback",'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("LEGACY_TEST_ANCHOR_COUNT_NOT_ONE")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          lines = [
              'test(',
              '  "3. ACTIVE global SUPERADMIN gets exact Pro Club support read without tenant discovery",',
              '  async () => {',
              '    const db = authedDb(GLOBAL_SUPERADMIN);',
              '',
              '    const clubSnapshot = await assertSucceeds(',
              '      getDoc(',
              '        doc(',
              '          db,',
              '          "proClubs",',
              '          CLUB_A,',
              '        ),',
              '      ),',
              '    );',
              '',
              '    assert.equal(clubSnapshot.data()?.name, "Club A");',
              '',
              '    await assertFails(',
              '      getDocs(',
              '        collection(',
              '          db,',
              '          "proClubs",',
              '        ),',
              '      ),',
              '    );',
              '  },',
              ');',
          ]
          replacement = "\n".join(lines)
          p.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY

      - name: Exact changed-file gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "tests/firestore.pro-club.rules.test.ts"
          git diff -- tests/firestore.pro-club.rules.test.ts

      - name: Commit fast-forward to product branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/firestore.pro-club.rules.test.ts
          git commit -m 'test(pro-club): align SuperAdmin exact support read expectation'
          git push origin HEAD:feat/pro-club-superadmin-support-read-v1-foundation
