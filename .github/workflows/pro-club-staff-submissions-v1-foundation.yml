name: Pro Club Staff Submissions V1 Foundation

on:
  push:
    branches:
      - feat/pro-club-staff-submissions-v1-foundation
    paths:
      - src/lib/proClubStaffSubmissions.ts
      - src/lib/firestore/proClubStaffSubmissionsRepository.ts
      - tests/proClubStaffSubmissionsModel.unit.test.ts
      - tests/proClubStaffSubmissionsRepository.unit.test.ts
      - .github/workflows/pro-club-staff-submissions-v1-foundation.yml
  pull_request:
    paths:
      - src/lib/proClubStaffSubmissions.ts
      - src/lib/firestore/proClubStaffSubmissionsRepository.ts
      - tests/proClubStaffSubmissionsModel.unit.test.ts
      - tests/proClubStaffSubmissionsRepository.unit.test.ts
      - .github/workflows/pro-club-staff-submissions-v1-foundation.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Runtime provenance
        run: |
          node --version
          npm --version
          git rev-parse HEAD
          git status --short

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix functions ci --ignore-scripts

      - name: Targeted Staff Submissions foundation tests
        run: >-
          node --experimental-test-module-mocks --import tsx --test
          tests/proClubStaffSubmissionsModel.unit.test.ts
          tests/proClubStaffSubmissionsRepository.unit.test.ts
          tests/proClubTechnicalGovernance.unit.test.ts
          tests/proClubStaffManagementModel.unit.test.ts

      - name: Root TypeScript
        run: npm run lint

      - name: App build
        run: npm run build

      - name: Diff whitespace check
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            git diff --check HEAD^ HEAD
          fi
