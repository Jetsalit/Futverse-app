name: Verify PR147 Pro Club SuperAdmin Runtime P2 R1

on:
  push:
    branches:
      - verify/pr147-pro-club-superadmin-runtime-p2-r1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout verification HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact product parent and scope
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_HEAD="49207d987c9afb51e23b0b236cf29d0c19bfef3c"
          PRODUCT_BASE="1e114c79fcf1a288c7d26628eed437c8d38eef7e"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_HEAD"
          test "$(git merge-base "$PRODUCT_BASE" "$PRODUCT_HEAD")" = "$PRODUCT_BASE"
          mapfile -t files < <(git diff --name-only "$PRODUCT_BASE" "$PRODUCT_HEAD" | sort)
          expected=(
            ".github/workflows/pro-club-superadmin-onboarding-control-v1-runtime-adapter.yml"
            "src/lib/firestore/proClubSuperAdminOnboardingControlRepository.ts"
            "tests/proClubSuperAdminOnboardingControlRuntime.test.ts"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#files[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!files[@]}"; do test "${files[$i]}" = "${expected_sorted[$i]}"; done
          git diff --check "$PRODUCT_BASE" "$PRODUCT_HEAD"

      - name: Select preinstalled Java 21
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JAVA_HOME_21_X64"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version

      - name: Install locked root dependencies
        run: npm ci --ignore-scripts

      - name: Install locked Functions dependencies
        run: npm --prefix functions ci --ignore-scripts

      - name: Runtime adapter Firestore emulator
        run: >-
          npx --no-install firebase emulators:exec
          --project demo-futverse-pro-club-superadmin-runtime-v1
          --only firestore
          "node --import tsx --test --test-concurrency=1 tests/proClubSuperAdminOnboardingControlRuntime.test.ts"

      - name: Existing Pro Club emulator regression
        run: npm run test:pro-club-emulator-regression

      - name: Root TypeScript
        run: npx --no-install tsc --noEmit

      - name: App build
        run: npm run build

      - name: Safety boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only 49207d987c9afb51e23b0b236cf29d0c19bfef3c HEAD)" = ".github/workflows/verify-pr147-pro-club-superadmin-runtime-p2-r1.yml"
          ! git diff 1e114c79fcf1a288c7d26628eed437c8d38eef7e 49207d987c9afb51e23b0b236cf29d0c19bfef3c -- package.json package-lock.json functions/package.json functions/package-lock.json | grep -q .
